# ===========================================================================
# Fleet Manager - środowisko deweloperskie Docker
#
# Trzy usługi:
#   - app      : PHP-FPM 8.3 + composer + node (build asset Vite)
#   - nginx    : reverse-proxy do PHP-FPM, serwuje /public
#   - mysql    : MySQL 8 z persistującym wolumenem
#   - phpmyadmin : opcjonalny GUI do MySQL (profil "tools")
#
# Uruchomienie:
#   docker compose up -d --build
#   -> aplikacja: http://localhost:8080
#   -> phpMyAdmin: docker compose --profile tools up -d → http://localhost:8081
# ===========================================================================
services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: fleet_app
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - vendor_cache:/var/www/html/vendor
      - node_modules_cache:/var/www/html/node_modules
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: fleet_management
      DB_USERNAME: fleet
      DB_PASSWORD: secret
      APP_ENV: local
      APP_DEBUG: "true"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - fleet

  nginx:
    image: nginx:1.27-alpine
    container_name: fleet_nginx
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - fleet

  mysql:
    image: mysql:8.0
    container_name: fleet_mysql
    command: ["--default-authentication-plugin=mysql_native_password", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_DATABASE: fleet_management
      MYSQL_USER: fleet
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    ports:
      - "3307:3306"   # zewnętrzny 3307 żeby nie kolidować z lokalnym MySQL/XAMPP
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -ufleet -psecret || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - fleet

  phpmyadmin:
    image: phpmyadmin:5
    container_name: fleet_pma
    profiles: ["tools"]      # uruchamiane tylko z --profile tools
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: rootsecret
      UPLOAD_LIMIT: 64M
    ports:
      - "8081:80"
    depends_on:
      - mysql
    networks:
      - fleet

volumes:
  mysql_data:
  vendor_cache:
  node_modules_cache:

networks:
  fleet:
    driver: bridge
